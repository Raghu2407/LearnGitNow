  <style>
    :root {
      --bg: #FFFDF8;
      --surface: #FFFFFF;
      --surface2: #F5F2EA;
      --border: #E8E0D0;
      --text: #1C1A16;
      --text2: #5C5648;
      --accent: #E85D04;
      --accent2: #FF8C42;
      --code-bg: #F0EDE6;
      --tag-bg: #FFF0E6;
      --tag-text: #C44A00;
    }
    .dark {
      --bg: #141210;
      --surface: #1E1B17;
      --surface2: #252119;
      --border: #3A342C;
      --text: #F5F0E8;
      --text2: #A09880;
      --accent: #FF6B35;
      --accent2: #FFB347;
      --code-bg: #2A251E;
      --tag-bg: #3A2010;
      --tag-text: #FF8C42;
    }
    * { font-family: 'Outfit', sans-serif; }
    body { background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
    .surface { background: var(--surface); border: 1px solid var(--border); }
    .surface2 { background: var(--surface2); }
    .text-muted { color: var(--text2); }
    .accent { color: var(--accent); }
    .accent-bg { background: var(--accent); }
    .tag-style { background: var(--tag-bg); color: var(--tag-text); }
    .border-style { border-color: var(--border); }
    code, .mono { font-family: 'JetBrains Mono', monospace; }
    .code-block { background: var(--code-bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
    .cmd-card { background: var(--surface); border: 1px solid var(--border); transition: all 0.2s; }
    .cmd-card:hover { border-color: var(--accent); box-shadow: 0 4px 20px rgba(232,93,4,0.1); }
    .sidebar-link { color: var(--text2); transition: all 0.15s; }
    .sidebar-link:hover, .sidebar-link.active { color: var(--accent); font-weight: 600; }
    .copy-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); transition: all 0.2s; cursor: pointer; }
    .copy-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
    .copy-btn.copied { background: #16a34a; color: white; border-color: #16a34a; }
    .lang-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .header-bar { background: var(--surface); border-bottom: 1px solid var(--border); }
    .category-badge { background: var(--tag-bg); color: var(--tag-text); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; }
    .search-box { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .search-box::placeholder { color: var(--text2); }
    .toggle-btn { background: var(--surface2); border: 1px solid var(--border); }
    .section-title { border-bottom: 2px solid var(--accent); }
    .pill { background: var(--surface2); border: 1px solid var(--border); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    @media (max-width: 768px) { .sidebar { display: none; } }

</head>

          kn: "ಫೈಲ್ ಏಕೆ ನಿರ್ಲಕ್ಷಿಸಲ್ಪಡುತ್ತಿದೆ — ಯಾವ .gitignore ನಿಯಮ ಹೊಂದಿಕೆಯಾಗುತ್ತಿದೆ ಎಂದು ತಿಳಿಸುತ್ತದೆ.",
          hi: "बताता है कि file क्यों ignore हो रही है — कौन सा .gitignore rule match हो रहा है।"
        },
        examples: [
          { code: "git check-ignore -v .env", note: { en: "See which rule ignores .env", kn: ".env ಅನ್ನು ಯಾವ ನಿಯಮ ನಿರ್ಲಕ್ಷಿಸುತ್ತದೆ ಎಂದು ನೋಡಿ", hi: "देखें कौन सा rule .env ignore करता है" } }
        ]
      }
    ]
  }
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentLang = 'en';
let isDark = false;

// ─── RENDER ───────────────────────────────────────────────────────────────────
function copyToClipboard(code, btn) {
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = UI[currentLang].copied;
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = UI[currentLang].copy;
      btn.classList.remove('copied');
    }, 2000);
  });
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = categories.map(cat => `
    <a href="#${cat.id}" class="sidebar-link flex items-center gap-2 px-2 py-1.5 rounded-lg text-sm">
      <span>${cat.icon}</span>
      <span>${cat.label[currentLang]}</span>
      <span class="ml-auto text-xs opacity-50">${cat.commands.length}</span>
    </a>
  `).join('');
}

function renderSections(filter = '') {
  const container = document.getElementById('commandSections');
  const lf = filter.toLowerCase();

  let html = '';
  categories.forEach(cat => {
    const filteredCmds = cat.commands.filter(c => {
      if (!lf) return true;
      return c.cmd.toLowerCase().includes(lf) ||
             c.desc[currentLang].toLowerCase().includes(lf) ||
             c.syntax.toLowerCase().includes(lf) ||
             c.examples.some(e => e.code.toLowerCase().includes(lf));
    });
    if (filteredCmds.length === 0) return;

    html += `
    <section id="${cat.id}" class="mb-12">
      <div class="flex items-center gap-3 mb-6">
        <span class="text-2xl">${cat.icon}</span>
        <h2 class="text-xl font-bold section-title pb-1 pr-4">${cat.label[currentLang]}</h2>
        <span class="category-badge px-2 py-0.5 rounded-full mono">${filteredCmds.length} ${UI[currentLang].commands}</span>
      </div>
      <div class="space-y-5">
        ${filteredCmds.map(cmd => renderCommandCard(cmd)).join('')}
      </div>
    </section>`;
  });

  if (!html) {
    html = `<div class="text-center py-16 text-muted">
      <div class="text-5xl mb-4">🔍</div>
      <p class="text-lg font-semibold">No commands found</p>
      <p class="text-sm mt-1">Try a different search term</p>
    </div>`;
  }

  container.innerHTML = html;
  container.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => copyToClipboard(btn.dataset.code, btn));
  });
}

function renderCommandCard(cmd) {
  const desc = cmd.desc[currentLang];
  const ui = UI[currentLang];

  const examplesHtml = cmd.examples.map(ex => `
    <div class="mt-3">
      <div class="code-block rounded-lg p-3 flex items-start justify-between gap-2">
        <code class="mono text-sm break-all flex-1" style="color:var(--accent)">${escapeHtml(ex.code)}</code>
        <button class="copy-btn flex-shrink-0 mono text-xs px-2 py-1 rounded" data-code="${escapeHtml(ex.code)}">${ui.copy}</button>
      </div>
      ${ex.note ? `<p class="text-xs text-muted mt-1 pl-1">${ex.note[currentLang]}</p>` : ''}
    </div>
  `).join('');

  return `
  <div class="cmd-card rounded-xl p-5">
    <div class="flex flex-wrap items-start justify-between gap-2 mb-2">
      <div class="flex items-center gap-2 flex-wrap">
        <code class="mono font-semibold text-base px-2 py-0.5 rounded" style="background:var(--tag-bg);color:var(--tag-text)">${escapeHtml(cmd.cmd)}</code>
      </div>
    </div>
    <p class="text-sm mb-3" style="color:var(--text2)">${desc}</p>
    <div class="pill rounded-lg px-3 py-2 mb-3">
      <span class="text-xs font-semibold text-muted uppercase tracking-wider">${ui.syntax}</span>
      <code class="mono text-sm block mt-1 break-all" style="color:var(--accent2)">${escapeHtml(cmd.syntax)}</code>
    </div>
    <div class="text-xs font-semibold text-muted uppercase tracking-wider mb-1">${ui.example}s</div>
    ${examplesHtml}
  </div>`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateUI() {
  document.getElementById('siteTitle').textContent = UI[currentLang].title;
  document.getElementById('siteSubtitle').textContent = UI[currentLang].subtitle;
  document.getElementById('searchBox').placeholder = UI[currentLang].search;
  renderSidebar();
  renderSections(document.getElementById('searchBox').value);
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
document.getElementById('langSelect').addEventListener('change', e => {
  currentLang = e.target.value;
  updateUI();
});

document.getElementById('themeToggle').addEventListener('click', () => {
  isDark = !isDark;
  document.documentElement.classList.toggle('dark', isDark);
  document.getElementById('themeToggle').textContent = isDark ? '🌙' : '☀️';
});

let searchTimeout;
document.getElementById('searchBox').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => renderSections(e.target.value), 200);
});

// Highlight active sidebar link on scroll
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
      const link = document.querySelector(`.sidebar-link[href="#${entry.target.id}"]`);
      if (link) link.classList.add('active');
    }
  });
}, { rootMargin: '-20% 0px -70% 0px' });

// ─── INIT ─────────────────────────────────────────────────────────────────────
updateUI();
setTimeout(() => {
  document.querySelectorAll('section[id]').forEach(s => observer.observe(s));
}, 100);
</script>
</body>
</html>
